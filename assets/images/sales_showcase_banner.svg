<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 290" width="1024" height="290">
  <defs>
    <linearGradient id="salesBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>
    <linearGradient id="salesAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="290" fill="url(#salesBgGrad)"/>
  <rect x="0" y="0" width="1024" height="290" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- LEFT SPLIT: Product Cover Mockup (Width: 480) -->
  <g transform="translate(15, 15)">
    <rect width="470" height="260" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Top graphic banner -->
    <rect x="15" y="15" width="230" height="150" rx="8" fill="url(#salesAccentGrad)"/>
    
    <text x="30" y="52" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="18" letter-spacing="0.5">SALES FORECAST</text>
    <text x="30" y="74" fill="#a7f3d0" font-family="'Outfit', 'Inter', sans-serif" font-weight="700" font-size="14">PREDICTIVE ML SYSTEM</text>
    
    <line x1="30" y1="90" x2="215" y2="90" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    
    <text x="30" y="112" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">Multi-Store Revenue Modeling</text>
    <text x="30" y="128" fill="#d1fae5" font-family="sans-serif" font-size="9">XGBoost, ARIMA &amp; Elasticity Analysis</text>
    <text x="30" y="150" fill="#facc15" font-family="sans-serif" font-size="9" font-weight="700">PORTFOLIO CASE STUDY | DASHRATH SINGH</text>

    <!-- Tablet / Chart Graphic on Right of Left Split -->
    <g transform="translate(265, 15)">
      <rect width="190" height="230" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <rect x="8" y="10" width="174" height="210" rx="8" fill="#090d16"/>
      <!-- Header -->
      <text x="18" y="30" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">Store Performance</text>
      <!-- Mini Chart -->
      <polyline points="20,110 50,95 80,105 110,65 140,55 170,40" fill="none" stroke="#10b981" stroke-width="2.5"/>
      <circle cx="170" cy="40" r="4" fill="#34d399"/>
      <text x="18" y="140" fill="#94a3b8" font-size="9">Monthly Growth</text>
      <text x="18" y="162" fill="#34d399" font-size="16" font-weight="800">+18.3%</text>
      <rect x="18" y="180" width="154" height="26" rx="4" fill="#047857"/>
      <text x="45" y="197" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Forecast Report</text>
    </g>

    <text x="30" y="200" fill="#94a3b8" font-family="sans-serif" font-size="11">Scikit-learn, XGBoost &amp; Power BI</text>
    <text x="30" y="222" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">Proven +18.3% Revenue Precision</text>
  </g>

  <!-- VERTICAL DIVIDER -->
  <line x1="505" y1="15" x2="505" y2="275" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- RIGHT SPLIT: Power BI Executive Dashboard (Width: 500) -->
  <g transform="translate(520, 15)">
    <!-- Dashboard Header -->
    <rect width="489" height="38" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <circle cx="20" cy="19" r="6" fill="#10b981"/>
    <text x="35" y="24" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="13">RETAIL INSIGHTS</text>
    <text x="145" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">EXECUTIVE SALES DASHBOARD</text>
    <rect x="390" y="8" width="85" height="22" rx="4" fill="#047857"/>
    <text x="400" y="23" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Q4 FORECAST</text>

    <!-- 4 KPI CARDS -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="116" height="60" rx="6" fill="#131c31" stroke="#1e293b"/>
      <text x="12" y="18" fill="#94a3b8" font-size="9" font-family="sans-serif">TOTAL PROJECTED REV</text>
      <text x="12" y="44" fill="#10b981" font-size="18" font-weight="800" font-family="sans-serif">$1.42M</text>
      
      <rect x="124" y="0" width="116" height="60" rx="6" fill="#131c31" stroke="#1e293b"/>
      <text x="136" y="18" fill="#94a3b8" font-size="9" font-family="sans-serif">MODEL ACCURACY</text>
      <text x="136" y="44" fill="#38bdf8" font-size="18" font-weight="800" font-family="sans-serif">92.4%</text>

      <rect x="248" y="0" width="116" height="60" rx="6" fill="#131c31" stroke="#1e293b"/>
      <text x="260" y="18" fill="#94a3b8" font-size="9" font-family="sans-serif">STORE ORDERS</text>
      <text x="260" y="44" fill="#facc15" font-size="18" font-weight="800" font-family="sans-serif">142.8K</text>

      <rect x="372" y="0" width="117" height="60" rx="6" fill="#131c31" stroke="#1e293b"/>
      <text x="384" y="18" fill="#94a3b8" font-size="9" font-family="sans-serif">STOCKOUT DROP</text>
      <text x="384" y="44" fill="#a78bfa" font-size="18" font-weight="800" font-family="sans-serif">-28.0%</text>
    </g>

    <!-- CHARTS AREA (Bottom) -->
    <g transform="translate(0, 118)">
      <!-- Left Chart: Time Series -->
      <rect x="0" y="0" width="260" height="142" rx="6" fill="#131c31" stroke="#1e293b"/>
      <text x="12" y="18" fill="#cbd5e1" font-size="10" font-weight="700" font-family="sans-serif">ACTUAL VS PREDICTED SALES</text>
      <line x1="20" y1="40" x2="245" y2="40" stroke="#1e293b" stroke-width="1"/>
      <line x1="20" y1="80" x2="245" y2="80" stroke="#1e293b" stroke-width="1"/>
      <line x1="20" y1="120" x2="245" y2="120" stroke="#1e293b" stroke-width="1"/>
      <!-- Actual Curve -->
      <polyline points="25,100 65,85 105,95 145,65 185,55 225,48" fill="none" stroke="#64748b" stroke-width="2"/>
      <!-- Predicted Curve -->
      <polyline points="25,98 65,82 105,90 145,60 185,50 225,42" fill="none" stroke="#10b981" stroke-width="2.5"/>
      <circle cx="225" cy="42" r="4" fill="#34d399"/>
      <text x="25" y="134" fill="#10b981" font-size="8">● Predicted (XGBoost)</text>
      <text x="140" y="134" fill="#64748b" font-size="8">● Actual Historical</text>

      <!-- Right Chart: Feature Importance -->
      <rect x="270" y="0" width="219" height="142" rx="6" fill="#131c31" stroke="#1e293b"/>
      <text x="282" y="18" fill="#cbd5e1" font-size="10" font-weight="700" font-family="sans-serif">FEATURE IMPORTANCE</text>
      
      <text x="282" y="42" fill="#94a3b8" font-size="9">Promo Discount</text>
      <rect x="360" y="32" width="115" height="10" rx="3" fill="#1e293b"/>
      <rect x="360" y="32" width="102" height="10" rx="3" fill="#10b981"/>

      <text x="282" y="66" fill="#94a3b8" font-size="9">Historical Demand</text>
      <rect x="360" y="56" width="115" height="10" rx="3" fill="#1e293b"/>
      <rect x="360" y="56" width="88" height="10" rx="3" fill="#38bdf8"/>

      <text x="282" y="90" fill="#94a3b8" font-size="9">Holiday Season</text>
      <rect x="360" y="80" width="115" height="10" rx="3" fill="#1e293b"/>
      <rect x="360" y="80" width="76" height="10" rx="3" fill="#facc15"/>

      <text x="282" y="114" fill="#94a3b8" font-size="9">Store Location</text>
      <rect x="360" y="104" width="115" height="10" rx="3" fill="#1e293b"/>
      <rect x="360" y="104" width="60" height="10" rx="3" fill="#a78bfa"/>
    </g>
  </g>
</svg>