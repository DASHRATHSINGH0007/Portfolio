<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 290" width="1024" height="290">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="290" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1024" height="290" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- LEFT SPLIT: Product Cover Mockup (Width: 480) -->
  <g transform="translate(15, 15)">
    <!-- Device / Cover Card -->
    <rect width="470" height="260" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Accent Top Banner -->
    <rect x="15" y="15" width="230" height="150" rx="8" fill="#0369a1"/>
    <rect x="15" y="15" width="230" height="150" rx="8" fill="url(#glowGrad)"/>
    
    <text x="30" y="52" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="18" letter-spacing="0.5">MEDINTEL AI</text>
    <text x="30" y="74" fill="#38bdf8" font-family="'Outfit', 'Inter', sans-serif" font-weight="700" font-size="14">HEALTHCARE DIAGNOSTICS</text>
    
    <line x1="30" y1="90" x2="215" y2="90" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    
    <text x="30" y="112" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">AI Medical Report Analyzer</text>
    <text x="30" y="128" fill="#bae6fd" font-family="sans-serif" font-size="9">OCR Digitizer &amp; Clinical Risk Prediction</text>
    <text x="30" y="150" fill="#facc15" font-family="sans-serif" font-size="9" font-weight="700">PORTFOLIO CASE STUDY | DASHRATH SINGH</text>

    <!-- Phone / Scanner Mockup on Right of Left Split -->
    <g transform="translate(265, 15)">
      <!-- Phone Frame -->
      <rect width="190" height="230" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <rect x="8" y="10" width="174" height="210" rx="10" fill="#090d16"/>
      <!-- Screen Header -->
      <circle cx="25" cy="28" r="8" fill="#0284c7"/>
      <text x="21" y="32" fill="#fff" font-size="11" font-weight="bold">M</text>
      <text x="40" y="32" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">MedIntel Scan</text>
      <!-- Scanner Frame -->
      <rect x="18" y="48" width="154" height="95" rx="6" fill="#131c31" stroke="#0284c7" stroke-width="1" stroke-dasharray="4 4"/>
      <line x1="25" y1="90" x2="165" y2="90" stroke="#38bdf8" stroke-width="2"/>
      <text x="35" y="98" fill="#38bdf8" font-family="sans-serif" font-size="8" font-weight="bold">ANALYZING MEDICAL RECORD...</text>
      <!-- Stats Pill -->
      <rect x="18" y="155" width="154" height="24" rx="4" fill="#1e293b"/>
      <text x="26" y="171" fill="#4ade80" font-family="sans-serif" font-size="9" font-weight="bold">✓ 94.8% Confidence Match</text>
      <rect x="18" y="186" width="154" height="24" rx="4" fill="#0284c7"/>
      <text x="50" y="202" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">View Diagnostics</text>
    </g>

    <text x="30" y="200" fill="#94a3b8" font-family="sans-serif" font-size="11">Deep Learning + OpenCV OCR</text>
    <text x="30" y="222" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">42% Faster Clinical Triage</text>
  </g>

  <!-- VERTICAL DIVIDER -->
  <line x1="505" y1="15" x2="505" y2="275" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- RIGHT SPLIT: Live Healthcare Intelligence Dashboard (Width: 500) -->
  <g transform="translate(520, 15)">
    <!-- Dashboard Header -->
    <rect width="489" height="38" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <circle cx="20" cy="19" r="6" fill="#38bdf8"/>
    <text x="35" y="24" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="13">MEDINTEL</text>
    <text x="110" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">CLINICAL TRIAGE &amp; RISK ENGINE</text>
    <rect x="400" y="8" width="75" height="22" rx="4" fill="#0284c7"/>
    <text x="412" y="23" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">LIVE V2.4</text>

    <!-- 4 KPI CARDS -->
    <g transform="translate(0, 48)">
      <!-- KPI 1 -->
      <rect x="0" y="0" width="116" height="60" rx="6" fill="#131c31" stroke="#1e293b"/>
      <text x="12" y="18" fill="#94a3b8" font-size="9" font-family="sans-serif">DIAGNOSTIC ACCURACY</text>
      <text x="12" y="44" fill="#38bdf8" font-size="18" font-weight="800" font-family="sans-serif">94.8%</text>
      
      <!-- KPI 2 -->
      <rect x="124" y="0" width="116" height="60" rx="6" fill="#131c31" stroke="#1e293b"/>
      <text x="136" y="18" fill="#94a3b8" font-size="9" font-family="sans-serif">TURNAROUND REDUCTION</text>
      <text x="136" y="44" fill="#4ade80" font-size="18" font-weight="800" font-family="sans-serif">-42.0%</text>

      <!-- KPI 3 -->
      <rect x="248" y="0" width="116" height="60" rx="6" fill="#131c31" stroke="#1e293b"/>
      <text x="260" y="18" fill="#94a3b8" font-size="9" font-family="sans-serif">REPORTS DIGITIZED</text>
      <text x="260" y="44" fill="#facc15" font-size="18" font-weight="800" font-family="sans-serif">18,450</text>

      <!-- KPI 4 -->
      <rect x="372" y="0" width="117" height="60" rx="6" fill="#131c31" stroke="#1e293b"/>
      <text x="384" y="18" fill="#94a3b8" font-size="9" font-family="sans-serif">AUC-ROC SCORE</text>
      <text x="384" y="44" fill="#ec4899" font-size="18" font-weight="800" font-family="sans-serif">0.962</text>
    </g>

    <!-- CHARTS AREA (Bottom) -->
    <g transform="translate(0, 118)">
      <!-- Left Chart: Risk Matrix -->
      <rect x="0" y="0" width="235" height="142" rx="6" fill="#131c31" stroke="#1e293b"/>
      <text x="12" y="18" fill="#cbd5e1" font-size="10" font-weight="700" font-family="sans-serif">DIAGNOSTIC RISK BREAKDOWN</text>
      
      <!-- Bar 1 -->
      <text x="12" y="42" fill="#94a3b8" font-size="9" font-family="sans-serif">Cardiovascular</text>
      <rect x="90" y="32" width="130" height="12" rx="3" fill="#1e293b"/>
      <rect x="90" y="32" width="108" height="12" rx="3" fill="#38bdf8"/>
      <text x="202" y="42" fill="#fff" font-size="8">83%</text>

      <!-- Bar 2 -->
      <text x="12" y="66" fill="#94a3b8" font-size="9" font-family="sans-serif">Metabolic / Vitals</text>
      <rect x="90" y="56" width="130" height="12" rx="3" fill="#1e293b"/>
      <rect x="90" y="56" width="118" height="12" rx="3" fill="#facc15"/>
      <text x="210" y="66" fill="#fff" font-size="8">91%</text>

      <!-- Bar 3 -->
      <text x="12" y="90" fill="#94a3b8" font-size="9" font-family="sans-serif">Pulmonary OCR</text>
      <rect x="90" y="80" width="130" height="12" rx="3" fill="#1e293b"/>
      <rect x="90" y="80" width="124" height="12" rx="3" fill="#4ade80"/>
      <text x="215" y="90" fill="#fff" font-size="8">95%</text>

      <!-- Bar 4 -->
      <text x="12" y="114" fill="#94a3b8" font-size="9" font-family="sans-serif">Hematology</text>
      <rect x="90" y="104" width="130" height="12" rx="3" fill="#1e293b"/>
      <rect x="90" y="104" width="98" height="12" rx="3" fill="#ec4899"/>
      <text x="192" y="114" fill="#fff" font-size="8">75%</text>

      <!-- Right Chart: Neural Network Confidence Curve -->
      <rect x="245" y="0" width="244" height="142" rx="6" fill="#131c31" stroke="#1e293b"/>
      <text x="257" y="18" fill="#cbd5e1" font-size="10" font-weight="700" font-family="sans-serif">MODEL CONVERGENCE &amp; LOSS</text>
      <!-- Grid lines -->
      <line x1="257" y1="40" x2="475" y2="40" stroke="#1e293b" stroke-width="1"/>
      <line x1="257" y1="75" x2="475" y2="75" stroke="#1e293b" stroke-width="1"/>
      <line x1="257" y1="110" x2="475" y2="110" stroke="#1e293b" stroke-width="1"/>
      <!-- Curve 1 (Accuracy) -->
      <polyline points="260,115 290,95 330,70 370,55 410,45 450,42 475,38" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <!-- Curve 2 (Loss) -->
      <polyline points="260,40 290,65 330,85 370,105 410,118 450,122 475,124" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3 3"/>
      
      <circle cx="475" cy="38" r="4" fill="#38bdf8"/>
      <text x="260" y="132" fill="#38bdf8" font-size="8" font-family="sans-serif">● Train Acc: 96.4%</text>
      <text x="365" y="132" fill="#f43f5e" font-size="8" font-family="sans-serif">-- Loss: 0.082</text>
    </g>
  </g>
</svg>