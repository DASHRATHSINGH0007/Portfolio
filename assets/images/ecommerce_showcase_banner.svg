<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 290" width="1024" height="290">
  <defs>
    <linearGradient id="ecomBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181329"/>
      <stop offset="100%" stop-color="#0b0817"/>
    </linearGradient>
    <linearGradient id="ecomAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="290" fill="url(#ecomBgGrad)"/>
  <rect x="0" y="0" width="1024" height="290" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- LEFT SPLIT: Product Cover Mockup (Width: 480) -->
  <g transform="translate(15, 15)">
    <rect width="470" height="260" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Top graphic banner -->
    <rect x="15" y="15" width="230" height="150" rx="8" fill="url(#ecomAccentGrad)"/>
    
    <text x="30" y="52" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="18" letter-spacing="0.5">E-COMMERCE</text>
    <text x="30" y="74" fill="#fef3c7" font-family="'Outfit', 'Inter', sans-serif" font-weight="700" font-size="14">DJANGO WEB PLATFORM</text>
    
    <line x1="30" y1="90" x2="215" y2="90" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    
    <text x="30" y="112" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">Full-Stack Storefront &amp; Cart</text>
    <text x="30" y="128" fill="#fef3c7" font-family="sans-serif" font-size="9">Authentication, Inventory &amp; Checkout</text>
    <text x="30" y="150" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="700">PORTFOLIO CASE STUDY | DASHRATH SINGH</text>

    <!-- Laptop / Store Graphic on Right of Left Split -->
    <g transform="translate(265, 15)">
      <rect width="190" height="230" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <rect x="8" y="10" width="174" height="210" rx="8" fill="#090d16"/>
      <!-- Store Header -->
      <text x="18" y="28" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">ShopHub Live Store</text>
      <!-- Product Cards Grid -->
      <rect x="15" y="42" width="72" height="64" rx="4" fill="#1e293b"/>
      <rect x="20" y="47" width="62" height="36" rx="2" fill="#334155"/>
      <text x="20" y="96" fill="#facc15" font-size="9" font-weight="bold">$49.99</text>

      <rect x="97" y="42" width="72" height="64" rx="4" fill="#1e293b"/>
      <rect x="102" y="47" width="62" height="36" rx="2" fill="#334155"/>
      <text x="102" y="96" fill="#facc15" font-size="9" font-weight="bold">$89.00</text>

      <!-- Cart bar -->
      <rect x="15" y="118" width="154" height="42" rx="4" fill="#131c31" stroke="#1e293b"/>
      <text x="25" y="134" fill="#cbd5e1" font-size="9">Shopping Cart (3 items)</text>
      <text x="25" y="150" fill="#4ade80" font-size="9" font-weight="bold">Subtotal: $188.99</text>

      <rect x="15" y="172" width="154" height="28" rx="4" fill="#d97706"/>
      <text x="45" y="190" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Proceed to Checkout</text>
    </g>

    <text x="30" y="200" fill="#94a3b8" font-family="sans-serif" font-size="11">Django, Python, SQLite &amp; JavaScript</text>
    <text x="30" y="222" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold">Scalable Multi-Vendor Architecture</text>
  </g>

  <!-- VERTICAL DIVIDER -->
  <line x1="505" y1="15" x2="505" y2="275" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- RIGHT SPLIT: E-commerce Admin & Telemetry Dashboard (Width: 500) -->
  <g transform="translate(520, 15)">
    <!-- Dashboard Header -->
    <rect width="489" height="38" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <circle cx="20" cy="19" r="6" fill="#f59e0b"/>
    <text x="35" y="24" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="13">STORE ADMIN</text>
    <text x="135" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">SALES &amp; INVENTORY TELEMETRY</text>
    <rect x="390" y="8" width="85" height="22" rx="4" fill="#d97706"/>
    <text x="402" y="23" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">ORDERS SYNC</text>

    <!-- 4 KPI CARDS -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="116" height="60" rx="6" fill="#131c31" stroke="#1e293b"/>
      <text x="12" y="18" fill="#94a3b8" font-size="9" font-family="sans-serif">TOTAL ORDERS</text>
      <text x="12" y="44" fill="#f59e0b" font-size="18" font-weight="800" font-family="sans-serif">1,280+</text>
      
      <rect x="124" y="0" width="116" height="60" rx="6" fill="#131c31" stroke="#1e293b"/>
      <text x="136" y="18" fill="#94a3b8" font-size="9" font-family="sans-serif">CONVERSION RATE</text>
      <text x="136" y="44" fill="#34d399" font-size="18" font-weight="800" font-family="sans-serif">4.85%</text>

      <rect x="248" y="0" width="116" height="60" rx="6" fill="#131c31" stroke="#1e293b"/>
      <text x="260" y="18" fill="#94a3b8" font-size="9" font-family="sans-serif">AVG ORDER VALUE</text>
      <text x="260" y="44" fill="#38bdf8" font-size="18" font-weight="800" font-family="sans-serif">$48.50</text>

      <rect x="372" y="0" width="117" height="60" rx="6" fill="#131c31" stroke="#1e293b"/>
      <text x="384" y="18" fill="#94a3b8" font-size="9" font-family="sans-serif">CATALOG ITEMS</text>
      <text x="384" y="44" fill="#facc15" font-size="18" font-weight="800" font-family="sans-serif">240+</text>
    </g>

    <!-- CHARTS AREA (Bottom) -->
    <g transform="translate(0, 118)">
      <!-- Left Chart: Daily Sales Volume -->
      <rect x="0" y="0" width="245" height="142" rx="6" fill="#131c31" stroke="#1e293b"/>
      <text x="12" y="18" fill="#cbd5e1" font-size="10" font-weight="700" font-family="sans-serif">DAILY CHECKOUT REVENUE</text>
      <line x1="15" y1="40" x2="230" y2="40" stroke="#1e293b" stroke-width="1"/>
      <line x1="15" y1="80" x2="230" y2="80" stroke="#1e293b" stroke-width="1"/>
      <line x1="15" y1="120" x2="230" y2="120" stroke="#1e293b" stroke-width="1"/>
      
      <!-- Stepped checkout line -->
      <polyline points="20,110 50,95 80,102 110,75 140,82 170,55 200,60 225,45" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
      <circle cx="225" cy="45" r="4" fill="#fbbf24"/>
      <text x="15" y="134" fill="#f59e0b" font-size="8">● Total Daily GMV: $3,450</text>

      <!-- Right Chart: Category Distribution -->
      <rect x="255" y="0" width="234" height="142" rx="6" fill="#131c31" stroke="#1e293b"/>
      <text x="267" y="18" fill="#cbd5e1" font-size="10" font-weight="700" font-family="sans-serif">REVENUE BY CATEGORY</text>
      
      <text x="267" y="42" fill="#94a3b8" font-size="9">Electronics</text>
      <rect x="350" y="32" width="125" height="10" rx="3" fill="#1e293b"/>
      <rect x="350" y="32" width="112" height="10" rx="3" fill="#f59e0b"/>

      <text x="267" y="66" fill="#94a3b8" font-size="9">Apparel &amp; Fashion</text>
      <rect x="350" y="56" width="125" height="10" rx="3" fill="#1e293b"/>
      <rect x="350" y="56" width="85" height="10" rx="3" fill="#38bdf8"/>

      <text x="267" y="90" fill="#94a3b8" font-size="9">Accessories</text>
      <rect x="350" y="80" width="125" height="10" rx="3" fill="#1e293b"/>
      <rect x="350" y="80" width="65" height="10" rx="3" fill="#34d399"/>

      <text x="267" y="114" fill="#94a3b8" font-size="9">Home Goods</text>
      <rect x="350" y="104" width="125" height="10" rx="3" fill="#1e293b"/>
      <rect x="350" y="104" width="45" height="10" rx="3" fill="#a78bfa"/>
    </g>
  </g>
</svg>